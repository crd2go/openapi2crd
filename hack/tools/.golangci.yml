version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gochecknoinits
    - revive
    - misspell
    - unparam
  settings:
    staticcheck:
      checks:
        - all
        - "-ST1000" # package-level doc comments not required
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true

formatters:
  enable:
    - gofmt
